name: Deploy backend over SSH

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pluskm-production-ssh
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run all tests and build bootJar
        run: ./gradlew clean check bootJar --no-daemon
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
      - name: Save verified JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: build/libs/backend-*-SNAPSHOT.jar
          if-no-files-found: error

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && vars.SSH_DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: artifact
      - name: Prepare SSH credentials
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p "$RUNNER_TEMP/pluskm-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/pluskm-ssh/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/pluskm-ssh/known_hosts"
      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
        run: |
          export SSH_KEY_PATH="$RUNNER_TEMP/pluskm-ssh/key"
          export SSH_KNOWN_HOSTS_FILE="$RUNNER_TEMP/pluskm-ssh/known_hosts"
          artifacts=(artifact/*.jar)
          test "${#artifacts[@]}" -eq 1
          bash scripts/deploy-ssh.sh "${artifacts[0]}"
      - name: Remove temporary credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/pluskm-ssh"
