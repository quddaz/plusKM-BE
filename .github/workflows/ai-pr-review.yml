name: Codex decision and test review

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  review:
    # Fork PR에는 secrets가 전달되지 않으므로, 같은 저장소의 PR에서만 댓글을 작성한다.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      BRANCH_NAME: ${{ github.head_ref }}
    steps:
      - name: Checkout review policy and script
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/review-policy.md
            scripts/ai_pr_review.mjs

      - name: Collect PR diff and changed files
        run: |
          gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" > pr.diff
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
            --jq '.[].filename' > changed-files.txt
          # 지나치게 큰 diff가 API 요청을 독점하지 않도록 상한을 둔다.
          head -c 120000 pr.diff > pr.diff.tmp
          mv pr.diff.tmp pr.diff

      - name: Request Codex pre-review
        run: node scripts/ai_pr_review.mjs

      - name: Update the PR review comment
        if: hashFiles('ai-review.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('ai-review.md', 'utf8');
            const marker = '<!-- codex-pre-review -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            const body = `${review}\n\n> 이 댓글은 PR 본문·변경 파일을 기준으로 한 사전 검토입니다. 최종 판단은 사람이 합니다.`;

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
