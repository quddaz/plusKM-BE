<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>plusKM — 가까운 응급실 찾기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./vendor/leaflet.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="stage">
    <section class="phone" aria-label="응급실 찾기 앱">
      <div class="screen">
        <section class="map-wrap" aria-label="주변 응급실 지도">
          <div id="map"></div>
          <div class="map-fallback" id="mapFallback" aria-hidden="true">
            <div class="fallback-grid"></div>
            <p>지도를 준비하고 있어요</p>
          </div>
          <form class="address-search" id="addressSearch">
            <span>⌕</span><input id="addressInput" aria-label="주소 검색" placeholder="주소를 검색하세요" autocomplete="street-address" />
            <button type="submit">검색</button>
          </form>
          <a class="emergency-call" href="tel:119">119</a>
          <div class="map-controls">
            <button id="myLocationButton" type="button">⌖ 내 위치</button>
            <label>반경
              <select id="radiusSelect" aria-label="검색 반경">
                <option value="1">1km</option><option value="3">3km</option>
                <option value="5">5km</option><option value="10" selected>10km</option>
                <option value="20">20km</option><option value="30">30km</option>
              </select>
            </label>
          </div>
          <button class="refresh-button" id="refreshButton" type="button"><span>↻</span> 현재 지도에서 검색</button>
          <section class="route-guide" id="routeGuide" aria-live="polite">
            <button id="closeRoute" type="button">×</button>
            <span class="turn-icon">↑</span>
            <div><small>자동차 경로</small><strong id="routeDuration">--분</strong><p id="routeDestination"></p></div>
            <b id="routeDistance"></b>
          </section>
          <section class="hospital-detail" id="hospitalDetail" aria-live="polite"></section>
        </section>
        <section class="bottom-sheet" id="bottomSheet">
          <button class="sheet-handle" id="sheetHandle" type="button" aria-label="병원 목록 펼치기"><span></span></button>
          <div class="sheet-summary">
            <div><p id="locationLabel">현재 위치를 확인하고 있어요</p><h1>주변 응급실 <strong id="resultCount">0</strong>곳</h1></div>
            <span id="dataState">연결 확인 중</span>
          </div>
          <p class="notice">병상 정보는 방문 전 전화로 확인해 주세요.</p>
          <div class="hospital-list" id="hospitalList" aria-live="polite"></div>
        </section>
      </div>
    </section>
    <aside class="intro">
      <p>가까운 응급실을 빠르게</p>
      <h2>내 위치에서 응급실을 찾고<br />자동차 경로까지 확인하세요.</h2>
      <ul>
        <li>지도를 눌러 출발 위치 선택</li>
        <li>최대 30km 주변 응급실 탐색</li>
        <li>전화 연결과 자동차 경로 확인</li>
      </ul>
    </aside>
  </main>
  <script src="./vendor/leaflet.js"></script>
  <script src="./app.js"></script>
</body>
</html>
