spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
  datasource:
    hikari:
      maximum-pool-size: 4
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client
            client-secret: test-secret
            scope: profile,email
jwt:
  secret-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==
  issuer: pluskm-test
  access-token-expiration: 60000
  refresh-token-expiration: 120000
guardian:
  encryption-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
cors:
  allowed:
    origins: http://localhost:3000
app:
  frontend-url: http://localhost:3000
csv:
  hospital-path: fixtures/places/hospitals.csv
  pharmacy-path: fixtures/places/pharmacies.csv
  batch-size: 2
  import-on-startup: false
emergency:
  api:
    service-key: ""
management:
  endpoints:
    web:
      exposure:
        include: health
