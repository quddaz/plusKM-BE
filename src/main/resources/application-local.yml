spring:
  profiles:
    active: local

  datasource:
    url: jdbc:mysql://localhost:3306/myapp_local
    username: local_user
    password: local_password
    driver-class-name: com.mysql.cj.jdbc.Driver

  # PostgreSQL/JDBC 로컬 실험 설정 (실행되지 않음)
  # datasource:
  #   url: jdbc:postgresql://localhost:5432/myapp_local
  #   username: local_user
  #   password: local_password
  #   driver-class-name: org.postgresql.Driver

  # MongoDB 로컬 실험 설정 (실행되지 않음, MongoDB는 JDBC가 아닌 Spring Data 사용)
  # data:
  #   mongodb:
  #     uri: mongodb://localhost:27017/myapp_local
  #     auto-index-creation: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

security:
  oauth2:
    client:
      registration:
        google:
          client-id: test-google-client-id
          client-secret: test-google-client-secret
          redirect-uri: http://localhost:8080/login/oauth2/code/google
          authorization-grant-type: authorization_code
          scope:
            - profile
            - email
      provider:
        google:
          authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
          token-uri: https://oauth2.googleapis.com/token
          user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
          user-name-attribute: sub

jwt:
  secret-key: test-jwt-secret-key
  issuer: myapp-local
  access-token-expiration: 3600000 # 1시간
  refresh-token-expiration: 1209600000 # 14일

cors:
  allowed:
    origins: http://localhost:3000
app:
  frontend-url: http://localhost:3000

emergency:
  api:
    service-key: ${EMERGENCY_API_SERVICE_KEY:}
  sync-delay: PT24H
  bed-sync-delay: PT5M
  bed-sync-initial-delay: PT0S

guardian:
  encryption-key: ${GUARDIAN_PHONE_ENCRYPTION_KEY:}
  sms:
    enabled: ${NAVER_SENS_ENABLED:false}
    endpoint: ${NAVER_SENS_ENDPOINT:https://sens.apigw.ntruss.com}
    service-id: ${NAVER_SENS_SERVICE_ID:}
    access-key: ${NAVER_CLOUD_ACCESS_KEY:}
    secret-key: ${NAVER_CLOUD_SECRET_KEY:}
    from: ${NAVER_SENS_FROM:}

logging:
  file:
    path: ./logs
